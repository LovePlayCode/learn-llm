<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM 学习 · 知识思维导图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root {
  --bg-0: #07090d;
  --bg-1: #0f1319;
  --bg-2: #1a1f28;
  --bg-3: #2a303a;
  --line: rgba(216,221,227,.08);
  --line-strong: rgba(216,221,227,.18);
  --txt-0: #eef0f3;
  --txt-1: #d8dde3;
  --txt-2: #b8bfc8;
  --txt-3: #8e96a3;
  --txt-4: #5c6675;
  --accent: #6b89a8;
  --accent-soft: rgba(107,137,168,.18);
  --warn: #b0856a;
  --green: #7a9b8a;
  --mono: 'SF Mono','JetBrains Mono','Fira Code','Menlo',monospace;
  --sans: -apple-system,'PingFang SC','Helvetica Neue',sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg-0);
  color: var(--txt-1);
  font-family: var(--sans);
  font-weight: 300;
  height: 100%;
  overflow: hidden;
  letter-spacing: .015em;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.65  0 0 0 0 0.72  0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
  mix-blend-mode: overlay;
  opacity: .22;
  pointer-events: none;
  z-index: 1;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  padding: 18px 28px;
  background: linear-gradient(180deg, rgba(7,9,13,.94) 0%, rgba(7,9,13,0) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}
header > * { pointer-events: auto; }
header .title {
  font-size: 17px;
  font-weight: 300;
  color: var(--txt-0);
  letter-spacing: .01em;
}
header .title em {
  font-style: normal;
  color: var(--accent);
}
header .legend {
  display: flex;
  gap: 16px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--txt-3);
  letter-spacing: .15em;
}
header .legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
header .legend i {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.dot-grad { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-wip  { background: var(--accent); }
.dot-warn { background: var(--warn); }

header .meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--txt-4);
  letter-spacing: .25em;
}

/* ===== MAIN CANVAS ===== */
#mindmap {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  right: 488px; /* leave space for panel (440 width + 24 right + 24 gap) */
  z-index: 2;
}
#mindmap svg { width: 100%; height: 100%; display: block; cursor: grab; }
#mindmap svg:active { cursor: grabbing; }

.link {
  fill: none;
  stroke-width: 1.5px;
  opacity: .6;
}

.node circle {
  cursor: pointer;
  transition: r .25s ease, fill .25s ease, stroke .25s ease, filter .25s ease;
}
.node:hover circle { filter: drop-shadow(0 0 14px var(--accent)) brightness(1.2); }
.node.selected circle {
  stroke: var(--accent) !important;
  stroke-width: 3px !important;
  filter: drop-shadow(0 0 16px var(--accent)) brightness(1.3) !important;
}
.node.selected text { fill: var(--txt-0) !important; font-weight: 400 !important; }
.node text {
  font-family: var(--sans);
  font-weight: 300;
  fill: var(--txt-1);
  pointer-events: none;
  paint-order: stroke;
  stroke: var(--bg-0);
  stroke-width: 5px;
  stroke-linejoin: round;
  cursor: pointer;
}

.node.root text {
  font-size: 19px;
  fill: var(--txt-0);
  font-weight: 400;
  letter-spacing: .04em;
}
.node.family text {
  font-size: 15px;
  fill: var(--txt-0);
  font-weight: 400;
}
.node.topic text {
  font-size: 13px;
  fill: var(--txt-1);
}

.node .badge {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  paint-order: stroke;
  stroke: var(--bg-0);
  stroke-width: 4px;
  pointer-events: none;
}
.node .badge.grad { fill: var(--green); }
.node .badge.wip { fill: var(--accent); }
.node .badge.warn { fill: var(--warn); }
.node .badge.shal { fill: var(--txt-4); }

.node .doccount {
  font-family: var(--mono);
  font-size: 9.5px;
  fill: var(--txt-4);
  paint-order: stroke;
  stroke: var(--bg-0);
  stroke-width: 4px;
  pointer-events: none;
}

.has-children-marker {
  font-family: var(--mono);
  font-size: 11px;
  fill: var(--txt-2);
  pointer-events: none;
  paint-order: stroke;
  stroke: var(--bg-0);
  stroke-width: 3px;
  font-weight: 400;
}

/* ===== DETAIL PANEL ===== */
#panel {
  position: fixed;
  right: 24px;
  top: 76px;
  bottom: 24px;
  width: 440px;
  background: linear-gradient(170deg, rgba(42,48,58,.88), rgba(15,19,25,.96));
  border: 1px solid var(--accent);
  border-radius: 4px;
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  padding: 28px 26px 20px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 30px rgba(0,0,0,.6), 0 0 0 4px rgba(107,137,168,.08);
  transition: border-color .3s ease;
}
#panel.dim-ready { border-color: var(--line-strong); }
#panel .empty-hint {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--txt-3);
  padding: 40px 20px;
}
#panel .empty-hint .arrow {
  font-family: var(--mono);
  font-size: 32px;
  color: var(--accent);
  margin-bottom: 18px;
  animation: pointLeft 1.6s ease-in-out infinite;
}
@keyframes pointLeft {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-8px); }
}
#panel .empty-hint .big {
  font-size: 16px;
  color: var(--txt-1);
  margin-bottom: 10px;
  font-weight: 300;
  letter-spacing: .02em;
}
#panel .empty-hint .small {
  font-size: 12px;
  color: var(--txt-4);
  line-height: 1.85;
}
#panel .empty-hint .stats {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
}
#panel .empty-hint .stat {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 12px 14px;
  text-align: left;
}
#panel .empty-hint .stat .v {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 200;
  color: var(--txt-0);
  display: block;
}
#panel .empty-hint .stat .v small { font-size: 12px; color: var(--txt-4); margin-left: 4px; }
#panel .empty-hint .stat .l {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--txt-4);
  letter-spacing: .2em;
  margin-top: 4px;
  display: block;
}

#panel .close {
  position: absolute;
  top: 14px; right: 16px;
  background: none;
  border: none;
  color: var(--txt-3);
  font-family: var(--mono);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  transition: all .2s ease;
}
#panel .close:hover { color: var(--txt-0); background: var(--accent-soft); }

#panel .pre {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .3em;
  margin-bottom: 8px;
}
#panel h2 {
  font-size: 22px;
  font-weight: 300;
  color: var(--txt-0);
  margin-bottom: 6px;
  line-height: 1.35;
  letter-spacing: -.005em;
}
#panel .sub {
  font-size: 12px;
  color: var(--txt-3);
  margin-bottom: 16px;
  font-style: italic;
}
#panel .badges {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
#panel .badge {
  display: inline-block;
  padding: 3px 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .15em;
  border-radius: 2px;
  border: 1px solid;
}
.badge-grad { color: var(--green); border-color: rgba(122,155,138,.4); background: rgba(122,155,138,.12); }
.badge-wip { color: var(--accent); border-color: rgba(107,137,168,.4); background: var(--accent-soft); }
.badge-warn { color: var(--warn); border-color: rgba(176,133,106,.4); background: rgba(176,133,106,.12); }
.badge-layer { color: var(--txt-2); border-color: var(--line-strong); background: rgba(255,255,255,.03); }

#panel .section-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .25em;
  color: var(--txt-4);
  margin: 8px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

#panel .files {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
}
#panel .files::-webkit-scrollbar { width: 4px; }
#panel .files::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

.file {
  display: block;
  padding: 11px 14px;
  margin-bottom: 6px;
  background: rgba(255,255,255,.025);
  border: 1px solid var(--line);
  border-left: 2px solid var(--line-strong);
  border-radius: 2px;
  text-decoration: none;
  color: var(--txt-1);
  font-size: 13px;
  transition: all .25s ease;
  line-height: 1.5;
}
.file:hover {
  background: var(--accent-soft);
  border-left-color: var(--accent);
  transform: translateX(3px);
}
.file.learn { border-left-color: var(--accent); }
.file.review { border-left-color: var(--green); }
.file.html { border-left-color: var(--warn); }

.file .ftype {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .2em;
  padding: 2px 6px;
  border-radius: 2px;
  margin-right: 8px;
  vertical-align: middle;
}
.file.learn .ftype { color: var(--accent); background: rgba(107,137,168,.15); }
.file.review .ftype { color: var(--green); background: rgba(122,155,138,.15); }
.file.html .ftype { color: var(--warn); background: rgba(176,133,106,.15); }

.file .ftitle { color: var(--txt-1); font-size: 13px; }
.file .fnote { color: var(--txt-3); font-size: 10.5px; margin-top: 4px; font-family: var(--mono); }

/* ===== HINTS / CONTROLS ===== */
.hint {
  position: fixed;
  left: 50%; bottom: 18px;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .3em;
  color: var(--txt-4);
  z-index: 10;
  pointer-events: none;
}

.zoom-ctrl {
  position: fixed;
  left: 24px; bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 10;
}
.zoom-ctrl button {
  width: 34px; height: 34px;
  background: rgba(42,48,58,.7);
  border: 1px solid var(--line-strong);
  color: var(--txt-2);
  font-family: var(--mono);
  font-size: 14px;
  cursor: pointer;
  border-radius: 3px;
  transition: all .2s ease;
  backdrop-filter: blur(10px);
}
.zoom-ctrl button:hover { color: var(--txt-0); border-color: var(--accent); background: var(--accent-soft); }

.action-bar {
  position: fixed;
  left: 50%;
  bottom: 60px;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 9;
}
.action-bar.hidden { display: none; }
.action-bar button {
  background: rgba(42,48,58,.7);
  border: 1px solid var(--line-strong);
  color: var(--txt-2);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .15em;
  padding: 8px 14px;
  border-radius: 3px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all .2s ease;
}
.action-bar button:hover { color: var(--txt-0); border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>

<header>

<div class="zoom-ctrl">

// ============================================================
// SETUP
// ============================================================
function getCSS(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const container = d3.select('#mindmap');
const containerEl = document.getElementById('mindmap');
let width = containerEl.clientWidth;
let height = containerEl.clientHeight;

const svg = container.append('svg').attr('width', width).attr('height', height);
const defs = svg.append('defs');

// glow filter
defs.append('filter')
  .attr('id', 'glow')
  .attr('x', '-60%').attr('y', '-60%').attr('width', '220%').attr('height', '220%')
  .html('<feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>');

const g = svg.append('g');
const linksLayer = g.append('g').attr('class', 'links');
const nodesLayer = g.append('g').attr('class', 'nodes');

// zoom behavior
const zoom = d3.zoom()
  .scaleExtent([0.3, 2.5])
  .on('zoom', (e) => g.attr('transform', e.transform));

svg.call(zoom);

// ============================================================
// INIT HIERARCHY · 默认家族节点 collapsed（_children）
// ============================================================
const root = d3.hierarchy(TREE);

// 默认折叠所有 family 节点的 children
root.children.forEach(family => {
  family._children = family.children;
  family.children = null;
});

// 用稳定的 id（路径串）做 enter/update/exit
let counter = 0;
root.eachBefore(d => { d.id = ++counter; });

// 横向树布局：vertical-size 控制节点上下间距，horizontal-size 控制层级宽度
const treeLayout = d3.tree().nodeSize([56, 280]).separation((a, b) => {
  return a.parent === b.parent ? 1 : 1.4;
});

// link generator
const linkGen = d3.linkHorizontal().x(d => d.y).y(d => d.x);
// 注意：d3.tree 默认布局是垂直的（x = horizontal-pos, y = depth），
// 我们要做水平树，所以渲染时把 x/y 互换即可（不修改原始数据）

const DURATION = 400;

let lastInitial = null;

function update(source) {
  // 计算布局
  treeLayout(root);

  const nodes = root.descendants();
  const links = root.links();

  // 计算 viewport 中心，让 source 对齐
  if (!lastInitial) {
    // 第一次：把 root 放到屏幕左 120px、垂直居中
    const rootNode = root;
    const tx = 120 - rootNode.y;
    const ty = height / 2 - rootNode.x;
    lastInitial = d3.zoomIdentity.translate(tx, ty).scale(1);
    svg.call(zoom.transform, lastInitial);
  }

  // ===== NODES =====
  const nodeSel = nodesLayer.selectAll('g.node')
    .data(nodes, d => d.id);

  // ENTER
  const nodeEnter = nodeSel.enter().append('g')
    .attr('class', d => {
      if (d.depth === 0) return 'node root';
      if (d.depth === 1) return 'node family';
      return 'node topic';
    })
    .attr('transform', d => {
      const x0 = source.y0 != null ? source.y0 : (source.parent ? source.parent.y : source.y);
      const y0 = source.x0 != null ? source.x0 : (source.parent ? source.parent.x : source.x);
      return `translate(${x0},${y0})`;
    })
    .style('opacity', 0)
    .on('click', (event, d) => {
      event.stopPropagation();
      handleClick(d);
    });

  nodeEnter.append('circle')
    .attr('r', d => d.depth === 0 ? 16 : (d.depth === 1 ? 11 : 7))
    .attr('fill', d => {
      if (d.depth === 0) return getCSS('--bg-2');
      if (d.depth === 1) return d.data.color;
      const fam = ancestorFamily(d);
      if (d.data.status === 'graduated') return fam.data.color;
      if (d.data.status === 'shallow') return getCSS('--bg-2');
      return getCSS('--bg-3');
    })
    .attr('stroke', d => {
      if (d.depth === 0) return getCSS('--accent');
      if (d.depth === 1) return d.data.color;
      if (d.data.status === 'graduated') return getCSS('--green');
      if (d.data.note && d.data.note.includes('D30')) return getCSS('--warn');
      const fam = ancestorFamily(d);
      return fam ? fam.data.color : getCSS('--txt-3');
    })
    .attr('stroke-width', d => d.depth === 0 ? 2.4 : (d.data.status === 'graduated' ? 2 : 1.4))
    .style('filter', d => d.data.status === 'graduated' ? 'url(#glow)' : 'none')
    .style('opacity', d => d.data.status === 'shallow' ? 0.55 : 1);

  // node label
  nodeEnter.append('text')
    .attr('dy', '.32em')
    .attr('x', d => {
      if (d.depth === 0) return 0;
      if (d.depth === 1) return 18;
      return 14;
    })
    .attr('text-anchor', d => d.depth === 0 ? 'middle' : 'start')
    .attr('y', d => d.depth === 0 ? -28 : 0)
    .text(d => d.data.name);

  // expand/collapse marker for nodes that have children (or _children)
  nodeEnter.filter(d => d._children || d.children)
    .filter(d => d.depth === 1) // only show on family nodes (root is implicit)
    .append('text')
    .attr('class', 'has-children-marker')
    .attr('text-anchor', 'middle')
    .attr('dy', '.35em')
    .attr('x', 0)
    .attr('y', 0)
    .text(d => d._children ? '+' : '−');

  // topic-level: show layer + status badge
  nodeEnter.filter(d => d.depth === 2)
    .append('text')
    .attr('class', d => {
      if (d.data.status === 'graduated') return 'badge grad';
      if (d.data.note && d.data.note.includes('D30')) return 'badge warn';
      if (d.data.status === 'shallow') return 'badge shal';
      return 'badge wip';
    })
    .attr('x', 14)
    .attr('y', 16)
    .text(d => {
      const layer = `[${d.data.layer || '?'}]`;
      if (d.data.status === 'graduated') return `${layer} ✓ 毕业 ${d.data.graduatedAt || ''}`;
      if (d.data.status === 'shallow') return `${layer} 浅尝`;
      if (d.data.note) return `${layer} ${d.data.note}`;
      return `${layer} 进行中`;
    });

  // topic-level: doc count
  nodeEnter.filter(d => d.depth === 2)
    .append('text')
    .attr('class', 'doccount')
    .attr('x', 14)
    .attr('y', -12)
    .text(d => `${d.data.files ? d.data.files.length : 0} docs · 点击查看`);

  // family node: doc count summary
  nodeEnter.filter(d => d.depth === 1)
    .append('text')
    .attr('class', 'doccount')
    .attr('x', 18)
    .attr('y', 22)
    .text(d => {
      const kids = d._children || d.children || [];
      const grad = kids.filter(k => k.data.status === 'graduated').length;
      return `${kids.length} 知识点 · ${grad} 已毕业`;
    });

  // UPDATE
  const nodeUpdate = nodeEnter.merge(nodeSel);
  nodeUpdate.transition().duration(DURATION)
    .attr('transform', d => `translate(${d.y},${d.x})`)
    .style('opacity', 1);

  // toggle marker
  nodeUpdate.selectAll('.has-children-marker')
    .text(d => d._children ? '+' : (d.children ? '−' : ''));

  // EXIT
  nodeSel.exit().transition().duration(DURATION)
    .attr('transform', d => `translate(${source.y},${source.x})`)
    .style('opacity', 0)
    .remove();

  // ===== LINKS =====
  const linkSel = linksLayer.selectAll('path.link')
    .data(links, d => d.target.id);

  const linkEnter = linkSel.enter().insert('path', ':first-child')
    .attr('class', 'link')
    .attr('d', () => {
      const x0 = source.y0 != null ? source.y0 : source.y;
      const y0 = source.x0 != null ? source.x0 : source.x;
      const o = { source: { x: y0, y: x0 }, target: { x: y0, y: x0 } };
      return linkGen(o);
    })
    .attr('stroke', d => {
      const fam = ancestorFamily(d.target);
      return fam ? fam.data.color : 'rgba(216,221,227,.18)';
    })
    .style('opacity', 0);

  linkEnter.merge(linkSel).transition().duration(DURATION)
    .attr('d', linkGen)
    .style('opacity', 0.6);

  linkSel.exit().transition().duration(DURATION)
    .attr('d', () => {
      const o = { source: { x: source.x, y: source.y }, target: { x: source.x, y: source.y } };
      return linkGen(o);
    })
    .style('opacity', 0)
    .remove();

  // 记录每个节点的旧位置
  root.each(d => { d.x0 = d.x; d.y0 = d.y; });
}

// ============================================================
// HELPERS
// ============================================================
function ancestorFamily(d) {
  let cur = d;
  while (cur && cur.depth > 1) cur = cur.parent;
  return cur && cur.depth === 1 ? cur : null;
}

function handleClick(d) {
  if (d.depth === 0) {
    // root：toggle 全部家族
    const allCollapsed = root.children.every(f => !f.children);
    root.children.forEach(f => {
      if (allCollapsed) {
        if (f._children) { f.children = f._children; f._children = null; }
      } else {
        if (f.children) { f._children = f.children; f.children = null; }
      }
    });
    update(d);
  } else if (d.depth === 1) {
    // family：toggle 该家族
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else {
      d.children = d._children;
      d._children = null;
    }
    update(d);
  } else if (d.depth === 2) {
    // topic：弹出详情面板
    showPanel(d);
  }
}

// ============================================================
// PANEL
// ============================================================
function renderOverview() {
  // 统计 7 大家族
  let totalTopics = 0;
  let totalGrad = 0;
  let totalDocs = 0;
  TREE.children.forEach(fam => {
    fam.children.forEach(t => {
      totalTopics++;
      if (t.status === 'graduated') totalGrad++;
      totalDocs += (t.files || []).length;
    });
  });

  const html = `
    <div class="empty-hint">
      <div class="arrow">←</div>
      <div class="big">点击任意知识点节点</div>
      <div class="small">先点击左侧家族圆圈展开<br/>再点击具体的知识点节点<br/>这里会列出所有关联的笔记和复习记录</div>
      <div class="stats">
        <div class="stat"><span class="v">${TREE.children.length}<small>家族</small></span><span class="l">FAMILIES</span></div>
        <div class="stat"><span class="v">${totalTopics}<small>知识点</small></span><span class="l">TOPICS</span></div>
        <div class="stat"><span class="v">${totalGrad}<small>已毕业</small></span><span class="l">GRADUATED</span></div>
        <div class="stat"><span class="v">${totalDocs}<small>文档</small></span><span class="l">DOCS</span></div>
      </div>
    </div>
  `;
  document.getElementById('panel-content').innerHTML = html;
}

function showPanel(d) {
  const data = d.data;
  const family = ancestorFamily(d);
  const famName = family ? family.data.name : '';
  const famColor = family ? family.data.color : getCSS('--accent');

  // 高亮当前选中节点（清除之前的高亮，给当前加 .selected）
  d3.selectAll('.node').classed('selected', false);
  d3.selectAll('.node').filter(n => n === d).classed('selected', true);

  let subText = '';
  if (data.status === 'graduated' && data.graduatedAt) subText = `于 ${data.graduatedAt} 毕业`;
  else if (data.note) subText = data.note;
  else if (data.status === 'shallow') subText = '浅尝即止';

  let badges = `<span class="badge badge-layer">层级 · ${data.layer || '—'}</span>`;
  if (data.status === 'graduated') badges += `<span class="badge badge-grad">已毕业</span>`;
  else if (data.note && data.note.includes('D30')) badges += `<span class="badge badge-warn">D30 待补</span>`;
  else if (data.status === 'shallow') badges += `<span class="badge badge-layer">浅尝</span>`;
  else badges += `<span class="badge badge-wip">进行中</span>`;

  const filesHtml = (data.files || []).map(f => {
    const isHtml = f.path.endsWith('.html');
    const cls = isHtml ? 'html' : f.type;
    const typeLabel = isHtml ? 'HTML' : (f.type === 'learn' ? 'LEARN' : 'REVIEW');
    return `<a class="file ${cls}" href="${f.path}" target="_blank" rel="noopener"><span class="ftype">${typeLabel}</span><span class="ftitle">${f.title}</span><div class="fnote">${f.path}</div></a>`;
  }).join('');

  const docCount = (data.files || []).length;

  const html = `
    <div class="pre" style="color:${famColor}">${famName.toUpperCase()}</div>
    <h2>${data.name}</h2>
    <div class="sub">${subText}</div>
    <div class="badges">${badges}</div>
    <div class="section-title">关联文档 · ${docCount} 篇 · 点击新标签页打开</div>
    <div class="files">${filesHtml || '<div style="color:var(--txt-4);font-style:italic;padding:20px 0;">暂无关联文档</div>'}</div>
  `;
  document.getElementById('panel-content').innerHTML = html;
}

function resetPanel() {
  d3.selectAll('.node').classed('selected', false);
  renderOverview();
}
window.resetPanel = resetPanel;
window.closePanel = resetPanel;

// 初始渲染 overview
renderOverview();

// 移除空白区域点击关闭 panel 的行为（panel 现在常驻）
// svg.on('click') 不再处理 panel

// ============================================================
// CONTROLS
// ============================================================
document.getElementById('zoom-in').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 1.3);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.3);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  if (lastInitial) svg.transition().duration(500).call(zoom.transform, lastInitial);
});

document.getElementById('expand-all').addEventListener('click', () => {
  root.children.forEach(f => {
    if (f._children) { f.children = f._children; f._children = null; }
  });
  update(root);
});
document.getElementById('collapse-all').addEventListener('click', () => {
  root.children.forEach(f => {
    if (f.children) { f._children = f.children; f.children = null; }
  });
  update(root);
});

window.addEventListener('resize', () => {
  width = containerEl.clientWidth;
  height = containerEl.clientHeight;
  svg.attr('width', width).attr('height', height);
});

// ============================================================
// FIRST RENDER
// ============================================================
root.x0 = height / 2;
root.y0 = 120;
update(root);
</script>
